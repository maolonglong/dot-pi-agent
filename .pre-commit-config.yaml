# prek (https://github.com/j178/prek) — fast pre-commit compatible hooks.
# Run manually: `prek run --all-files`

repos:
  # prek's built-in Rust implementations (offline, zero-setup fast path).
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key

  # Official gitleaks hook (https://github.com/gitleaks/gitleaks).
  # language: golang — prek builds the pinned rev with the Go toolchain,
  # independent of any system-installed gitleaks version.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Type-check pi extensions.
      - id: typecheck
        name: tsc --noEmit
        language: system
        entry: npm run typecheck
        pass_filenames: false
        files: \.ts$
